data:
  name: GB1_additive
  path: data/synthetic/GB1_additive.csv
  target_column: fitness
  normalization: none
  wildtype:
    method: sequence
    sequence: MTYKLILNGKTLKGETTTEAVDAATAEKVFKQYANDNGVDGEWTYDDATKTFTVTE
model:
  esm_layer: 33
  pooling_method: esm_attention
  hidden_dim1: 128
  hidden_dim2: 64
  hidden_dim3: 32
  hidden_dim4: 16
  dropout_rate: 0.1
  learning_rate: 0.0005
  batch_size: 64
  epochs: 50
  loss_type: huber
  final_activation: null
  patience: 15
  min_epochs: 10
  esm_model_name: esmc_300m
integrated_gradients:
  method: embedding
  attribution_method: signed
  interpolation_path: linear
  plot_interpolation_umap: false
  steps: 50
  batch_size: 10
analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    custom_sequences: []
results_dir: results/synthetic/GB1_additive_LINEAR
force_retrain: true
training:
  n_folds: 5
  test_fraction: 0.2
  split_seed: 42
