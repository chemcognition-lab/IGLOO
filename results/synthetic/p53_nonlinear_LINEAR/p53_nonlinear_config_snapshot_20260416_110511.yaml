data:
  name: p53_nonlinear
  path: data/synthetic/p53_nonlinear.csv
  target_column: fitness
  normalization: none
  wildtype:
    method: sequence
    sequence: 
model:
  esm_layer: 33
  pooling_method: esm_attention
  hidden_dim1: 256
  hidden_dim2: 128
  hidden_dim3: 64
  hidden_dim4: 32
  dropout_rate: 0.5
  learning_rate: 0.0005
  batch_size: 256
  epochs: 50
  loss_type: huber
  final_activation: null
  patience: 30
  min_epochs: 20
  esm_model_name: esmc_300m
integrated_gradients:
  method: embedding
  attribution_method: signed
  interpolation_path: linear
  plot_interpolation_umap: false
  steps: 50
  batch_size: 10
analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    custom_sequences: []
results_dir: results/synthetic/p53_nonlinear_LINEAR
force_retrain: true
training:
  n_folds: 5
  test_fraction: 0.2
  split_seed: 42
