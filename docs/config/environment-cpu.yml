name: igloo-cpu
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # Python
  - python=3.10

  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0

  # Machine learning
  - scikit-learn>=1.0.0
  - xgboost>=1.5.0

  # Deep learning (CPU-only PyTorch)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - cpuonly  # Force CPU-only installation

  # Data visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - plotly>=5.0.0

  # Development tools
  - pytest>=7.0.0
  - coverage>=6.0.0
  - ruff>=0.1.0
  - mypy>=1.0.0

  # Jupyter notebooks
  - jupyter>=1.0.0
  - ipykernel>=6.0.0
  - jupyterlab>=3.0.0

  # Additional tools
  - tqdm>=4.62.0
  - pyyaml>=6.0
  - requests>=2.28.0

  # Bioinformatics tools
  - biopython>=1.79

  # 3D visualization dependencies
  - nodejs>=16.0.0

  # pip dependencies
  - pip
  - pip:
    # ESM protein language model
    - fair-esm>=2.0.0
    # Tensor storage
    - safetensors>=0.3.0
    # Transformers
    - transformers>=4.21.0
    # 3D molecular visualization
    - py3Dmol>=2.0.0
    # Attribution methods
    - captum>=0.6.0
