name: igloo
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.9
  - pip
  # PyTorch with CUDA 12.1 support (compatible with CUDA 12.5)
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=12.1
  # Core scientific computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  # ML and data tools
  - xgboost>=1.5.0
  - tqdm>=4.62.0
  # Development tools
  - jupyter>=1.0.0
  - ipykernel>=6.0.0
  - pytest>=7.0.0
  - coverage>=6.0.0
  - ruff>=0.1.0
  # Additional dependencies
  - pyyaml
  - requests
  - pip:
    # ESM (Evolutionary Scale Modeling) - installed via pip
    - fair-esm
    - transformers
    - safetensors
