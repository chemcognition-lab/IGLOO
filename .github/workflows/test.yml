# This workflow will install Python dependencies, run tests and lint.
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python

name: Test Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Supported Python versions (numpy<2 pin has no 3.13 wheels)
        os: [ubuntu-24.04]
        python-version: ['3.11', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch: avoids downloading multi-GB CUDA wheels on CI
        pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
        pip install pytest coverage ruff
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check --select=E9,F63,F7,F82 src/
        # exit-zero treats all errors as warnings
        ruff check --exit-zero --statistics src/
    - name: Install project
      run: |
        pip install -e .
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
