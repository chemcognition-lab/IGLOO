# Configuration for ERBC integrated gradients analysis
# This config runs embedding-level IG with magnitude attribution

data:
  name: "ERBC"
  path: "data/Data_Donya_ERBC_Converted.csv"
  target_column: "log_production"
  normalization: "z-score"  # Options: "z-score", "none"
  wildtype:
    method: "variant_column"  # Options: "variant_column", "position", "sequence"
    variant_column: "Variant"
    wildtype_value: "WT"

model:
  esm_layer: 33
  pooling_method: "esm_attention"  # Options: "linear", "esm_attention"
  hidden_dim1: 512  # Reduced from 1024
  hidden_dim2: 256  # Reduced from 512
  hidden_dim3: 128  # Reduced from 255
  hidden_dim4: 64   # Reduced from 128
  dropout_rate: 0.1  # Reduced from 0.2
  learning_rate: 0.0001  # Reduced from 0.001
  batch_size: 64    # Reduced from 256
  epochs: 1000       # Increased from 100
  loss_type: "mse"  # Changed from huber to mse
  final_activation: null

# Sequence selection configuration for integrated gradients analysis
sequence_selection:
  # Basic options (True/False)
  include_extremes: true     # Include lowest and highest activity sequences
  include_median: true       # Include median activity sequence

  # Advanced options (numbers)
  include_top_n: 10           # Include top 10 additional sequences (beyond highest)
  include_bottom_n: 10        # Include bottom 10 additional sequences (beyond lowest)

  # Error filtering for top_n and bottom_n selections
  max_error_percent: 10.0    # Only include sequences with <10% prediction error

  # Custom sequences (empty list - no custom sequences specified)
  custom_sequences: []

integrated_gradients:
  method: "embedding"  # Options: "embedding", "token"
  attribution_method: "magnitude"  # Options: "magnitude", "signed"
  steps: 50
  batch_size: 10

results_dir: "results/ERBC_embedding_magnitude"
force_retrain: false
