# Configuration for T4Lysozyme (epistatic fitness model) integrated gradients analysis
# T4Lysozyme: 164 aa, P00720, 4000 variants generated

data:
  name: "T4Lysozyme_epistatic"
  path: "data/synthetic/T4Lysozyme_epistatic.csv"
  target_column: "fitness"
  normalization: "none"
  wildtype:
    method: "sequence"
    sequence: "MNIFEMLRIDEGLRLKIYKDTEGYYHIGIGHLLTKSPSLNAAKSELDKAIGRNCNGVITKDEAEKLFNQDVDAAVRGILRNAKLKPVYDSLDAVRRCALINMVFQMGETGVAGFTNSLRMLQQKRWDEAAVNLAKSRWYNQTPNRAKRVITTFRTGTWDAYKNL"

model:
  esm_layer: 33
  pooling_method: "esm_attention"
  hidden_dim1: 384
  hidden_dim2: 192
  hidden_dim3: 96
  hidden_dim4: 48
  dropout_rate: 0.35
  learning_rate: 0.0008
  batch_size: 96
  epochs: 60
  loss_type: "huber"
  final_activation: null
  patience: 15          # early-stopping patience (epochs without val improvement)
  min_epochs: 10        # floor on avg_best_epoch used for the final model

integrated_gradients:
  method: "embedding"
  attribution_method: "signed"
  interpolation_path: "linear"  # 'linear' | 'slerp' | 'nearest_neighbor' | 'guided_ig'
  plot_interpolation_umap: false   # UMAP projection of interpolation path; saved to results_dir
  steps: 500
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    include_all: true
    custom_sequences: []

results_dir: "results/synthetic/T4Lysozyme_epistatic_LINEAR"
force_retrain: false

training:
  n_folds: 5
  test_fraction: 0.20
  split_seed: 42
  noise:
    label_noise_std: 0.0    # σ in raw target units; 0 = no noise
    label_noise_seed: 0     # RNG seed for reproducibility
    input_noise_std: 0.0    # σ for per-batch embedding augmentation; 0 = off
