# Configuration for p53 (additive fitness model) integrated gradients analysis
# p53: 393 aa, P04637, 10000 variants generated

data:
  name: "p53_additive"
  path: "data/synthetic/p53_additive.csv"
  target_column: "fitness"
  normalization: "none"
  wildtype:
    method: "sequence"
    sequence: ""

model:
  esm_layer: 33
  pooling_method: "esm_attention"
  hidden_dim1: 1024
  hidden_dim2: 512
  hidden_dim3: 256
  hidden_dim4: 128
  dropout_rate: 0.5
  learning_rate: 0.0005
  batch_size: 256
  epochs: 50
  loss_type: "huber"
  final_activation: null

integrated_gradients:
  method: "embedding"
  attribution_method: "signed"
  steps: 50
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    custom_sequences: []

results_dir: "results/synthetic/p53_additive"
force_retrain: false
