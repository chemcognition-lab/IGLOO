# Configuration for p53 (epistatic fitness model) integrated gradients analysis
# p53: 393 aa, P04637, 10000 variants generated

data:
  name: "p53_epistatic"
  path: "data/synthetic/p53_epistatic.csv"
  target_column: "fitness"
  normalization: "none"
  wildtype:
    method: "sequence"
    sequence: ""

model:
  esm_layer: 33
  pooling_method: "esm_attention"
  hidden_dim1: 256
  hidden_dim2: 128
  hidden_dim3: 64
  hidden_dim4: 32
  dropout_rate: 0.5
  learning_rate: 0.0005
  batch_size: 256
  epochs: 50
  loss_type: "huber"
  final_activation: null
  patience: 30          # early-stopping patience (epochs without val improvement)
  min_epochs: 20        # floor on avg_best_epoch used for the final model

integrated_gradients:
  method: "embedding"
  attribution_method: "signed"
  interpolation_path: "linear"  # 'linear' | 'slerp' | 'nearest_neighbor' | 'guided_ig'
  plot_interpolation_umap: false   # UMAP projection of interpolation path; saved to results_dir
  steps: 50
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    custom_sequences: []

results_dir: "results/synthetic/p53_epistatic_LINEAR"
force_retrain: true

training:
  n_folds: 5
  test_fraction: 0.20
  split_seed: 42
