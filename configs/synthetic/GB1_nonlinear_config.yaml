# Configuration for GB1 (nonlinear fitness model) integrated gradients analysis
# GB1: 56 aa, P06654, 1500 variants generated

data:
  name: "GB1_nonlinear"
  path: "data/synthetic/GB1_nonlinear.csv"
  target_column: "fitness"
  normalization: "none"
  wildtype:
    method: "sequence"
    sequence: "MTYKLILNGKTLKGETTTEAVDAATAEKVFKQYANDNGVDGEWTYDDATKTFTVTE"

model:
  esm_layer: 33
  pooling_method: "esm_attention"
  hidden_dim1: 256
  hidden_dim2: 128
  hidden_dim3: 64
  hidden_dim4: 32
  dropout_rate: 0.3
  learning_rate: 0.001
  batch_size: 64
  epochs: 50
  loss_type: "huber"
  final_activation: null
  patience: 15          # early-stopping patience (epochs without val improvement)
  min_epochs: 10        # floor on avg_best_epoch used for the final model

integrated_gradients:
  method: "embedding"
  attribution_method: "signed"
  interpolation_path: "linear"  # 'linear' | 'slerp' | 'nearest_neighbor' | 'guided_ig'
  plot_interpolation_umap: false   # UMAP projection of interpolation path; saved to results_dir
  steps: 50
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    include_all: true
    custom_sequences: []

results_dir: "results/synthetic/GB1_nonlinear_LINEAR"
force_retrain: true

training:
  n_folds: 5
  test_fraction: 0.20
  split_seed: 42
