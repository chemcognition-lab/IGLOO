# Configuration for T4Lysozyme (nonlinear fitness model) integrated gradients analysis
# T4Lysozyme: 164 aa, P00720, 4000 variants generated

data:
  name: "T4Lysozyme_nonlinear"
  path: "data/synthetic/T4Lysozyme_nonlinear.csv"
  target_column: "fitness"
  normalization: "none"
  wildtype:
    method: "sequence"
    sequence: "MNIFEMLRIDEGLRLKIYKDTEGYYHIGIGHLLTKSPSLNAAKSELDKAIGRNCNGVITKDEAEKLFNQDVDAAVRGILRNAKLKPVYDSLDAVRRCALINMVFQMGETGVAGFTNSLRMLQQKRWDEAAVNLAKSRWYNQTPNRAKRVITTFRTGTWDAYKNL"

model:
  esm_layer: 33
  pooling_method: "esm_attention"
  hidden_dim1: 512
  hidden_dim2: 256
  hidden_dim3: 128
  hidden_dim4: 64
  dropout_rate: 0.4
  learning_rate: 0.0008
  batch_size: 128
  epochs: 50
  loss_type: "huber"
  final_activation: null

integrated_gradients:
  method: "embedding"
  attribution_method: "signed"
  steps: 50
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    custom_sequences: []

results_dir: "results/synthetic/T4Lysozyme_nonlinear"
force_retrain: false
