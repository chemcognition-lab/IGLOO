# Configuration for GB1 (additive fitness model) integrated gradients analysis
# GB1: 56 aa, P06654, 1500 variants generated

data:
  name: "GB1_additive"
  path: "data/synthetic/GB1_additive.csv"
  target_column: "fitness"
  normalization: "none"   # fitness is already WT-normalised (WT=1.0)
  wildtype:
    method: "sequence"
    sequence: "MTYKLILNGKTLKGETTTEAVDAATAEKVFKQYANDNGVDGEWTYDDATKTFTVTE"

model:
  esm_layer: 33
  pooling_method: "esm_attention"
  hidden_dim1: 256
  hidden_dim2: 128
  hidden_dim3: 64
  hidden_dim4: 32
  dropout_rate: 0.3
  learning_rate: 0.001
  batch_size: 64
  epochs: 50
  loss_type: "huber"
  final_activation: null
  # esm_model_name: esm2_t33_650M_UR50D

integrated_gradients:
  method: "embedding"
  attribution_method: "signed"
  interpolation_path: "guided_ig"  # 'linear' | 'slerp' | 'nearest_neighbor' | 'guided_ig'
  plot_interpolation_umap: true   # UMAP projection of interpolation path; saved to results_dir
  steps: 50
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 0
    include_bottom_n: 0
    custom_sequences: []

results_dir: "results/synthetic/GB1_additive_GUIDED_IG"
force_retrain: false
