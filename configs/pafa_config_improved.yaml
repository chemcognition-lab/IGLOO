# Configuration for PafA integrated gradients analysis
# This config runs token-level IG with signed attribution
# Improved version with better hyperparameters to prevent model collapse

data:
  name: "PafA"
  path: "data/PafA_data_processed.csv"
  target_column: "kcat_cMUP"
  normalization: "z-score"
  wildtype:
    method: "position"  # Use last sequence as WT
    position: "last"

model:
  esm_layer: 33
  pooling_method: "esm_attention"
  hidden_dim1: 512  # Reduced from 1024
  hidden_dim2: 256  # Reduced from 512
  hidden_dim3: 128  # Reduced from 255
  hidden_dim4: 64   # Reduced from 128
  dropout_rate: 0.1  # Reduced from 0.2
  learning_rate: 0.0001  # Reduced from 0.001
  batch_size: 64    # Reduced from 256
  epochs: 1000       # Increased from 100
  loss_type: "mse"  # Changed from huber to mse
  final_activation: null

integrated_gradients:
  method: "token"  # Use token-level IG
  attribution_method: "signed"  # Use signed attribution to get directional effects
  steps: 50
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true
    include_median: true
    include_top_n: 5
    include_bottom_n: 5
    custom_sequences: []

results_dir: "results/PafA_token_signed_global_norm"
force_retrain: true
