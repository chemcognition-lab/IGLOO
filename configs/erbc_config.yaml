# Configuration for ERBC integrated gradients analysis
# This config runs embedding-level IG with magnitude attribution

data:
  name: "ERBC"
  path: "data/Data_Donya_ERBC_Converted.csv"
  target_column: "log_production"
  normalization: "z-score"  # Options: "z-score", "none"
  wildtype:
    method: "variant_column"  # Options: "variant_column", "position", "sequence"
    variant_column: "Variant"
    wildtype_value: "WT"

model:
  esm_layer: 33
  pooling_method: "esm_attention"  # Options: "linear", "esm_attention"
  hidden_dim1: 1024
  hidden_dim2: 512
  hidden_dim3: 255
  hidden_dim4: 128
  dropout_rate: 0.2
  learning_rate: 0.001
  batch_size: 256
  epochs: 100
  loss_type: "huber"  # Options: "mse", "huber", "l1"
  final_activation: null

integrated_gradients:
  method: "embedding"  # Options: "embedding", "token"
  attribution_method: "magnitude"  # Options: "magnitude", "signed"
  steps: 50
  batch_size: 10

analysis:
  sequence_selection:
    include_extremes: true  # Include lowest and highest activity sequences
    include_median: true    # Include median activity sequence
    include_top_n: 2       # Include top N sequences (beyond highest)
    include_bottom_n: 2    # Include bottom N sequences (beyond lowest)
    custom_sequences: []   # Custom sequences to analyze
    # Example custom sequences:
    # - name: "Custom_Variant_1"
    #   sequence: "MSKGEELFTGVVPILVELDGDVNGHKFSVSGEGEGDATYGKLTLKFICTTGKLPVPWPTLVTTLSYGVQCFSRYPDHMKQHDFFKSAMPEGYVQERTIFFKDDGNYKTRAEVKFEGDTLVNRIELKGIDFKEDGNILGHKLEYNYNSHNVYIMADKQKNGIKVNFKIRHNIEDGSVQLADHYQQNTPIGDGPVLLPDNHYLSTQSALSKDPNEKRDHMVLLEFVTAAGITHGMDELYK"
    # - name: "Custom_Variant_2"
    #   index: 42  # Use sequence at this index in the dataset

results_dir: results/ERBC_embedding_magnitude  # Optional: custom results directory
force_retrain: false  # Set to true to force model retraining
