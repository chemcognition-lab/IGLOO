[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "igloo"
description = "IGLOO (Integrated Gradients for LOcational sensitivity in prOteins) - An ML pipeline for analyzing structural contributions to performance in protein variants."
readme = "README.rst"
authors = [
  {name = "Rana Barghout", email = "ranamoneim@gmail.com"}
]
maintainers = [
  {name = "Rana Barghout", email = "ranamoneim@gmail.com"}
]
classifiers = [

]
license = {text = "MIT license"}
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "fair-esm>=2.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "safetensors>=0.3.0",
    "tqdm>=4.62.0",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff",  # linting
    "tox", # testing
]

[project.urls]

bugs = "https://github.com/ranaabarghout/IGLOO/issues"
changelog = "https://github.com/ranaabarghout/IGLOO/blob/master/changelog.md"
homepage = "https://github.com/ranaabarghout/IGLOO"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]


[project.scripts]
igloo = "igloo.cli:app"


[tool.setuptools.dynamic]
version = {attr = "igloo.__version__"}

# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.tox]
legacy_tox_ini = """
[tox]
min_version = 4.0
env_list = py39, py310, py311, py312, py313, ruff
isolated_build = true

[gh]
python =
    3.13 = py313
    3.12 = py312
    3.11 = py311
    3.10 = py310
    3.9 = py39
    3.8 = py38

[testenv]
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:ruff]
deps =
    ruff
commands =
    ruff check .
"""